<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-Person Driving Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 100;
        }
        #instructions {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 100;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div>Speed: <span id="speed">0</span> km/h</div>
        <div>Score: <span id="score">0</span></div>
    </div>
    <div id="instructions">
        <div>WASD or Arrow Keys to drive</div>
        <div>W/↑: Accelerate</div>
        <div>S/↓: Brake</div>
        <div>A/←: Turn Left</div>
        <div>D/→: Turn Right</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 10, 300);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 100, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -100;
        directionalLight.shadow.camera.right = 100;
        directionalLight.shadow.camera.top = 100;
        directionalLight.shadow.camera.bottom = -100;
        scene.add(directionalLight);

        // Sky
        const skyGeometry = new THREE.SphereGeometry(500, 32, 32);
        const skyMaterial = new THREE.MeshBasicMaterial({
            color: 0x87CEEB,
            side: THREE.BackSide
        });
        const sky = new THREE.Mesh(skyGeometry, skyMaterial);
        scene.add(sky);

        // Road path function - creates a curvy road using sine wave
        const roadWidth = 20;
        const roadCurveFrequency = 0.01; // How often the road curves
        const roadCurveAmplitude = 30; // How much the road curves

        function getRoadCenterX(z) {
            // Creates a winding road using multiple sine waves for variety
            return Math.sin(z * roadCurveFrequency) * roadCurveAmplitude +
                   Math.sin(z * roadCurveFrequency * 0.5) * roadCurveAmplitude * 0.5;
        }

        // Create road segments that follow the curve
        const roadSegments = [];
        const roadSegmentLength = 20;
        const numSegments = 100;

        for (let i = 0; i < numSegments; i++) {
            const z = i * roadSegmentLength - 500;
            const segmentGeometry = new THREE.PlaneGeometry(roadWidth, roadSegmentLength);
            const segmentMaterial = new THREE.MeshLambertMaterial({ color: 0x404040 });
            const segment = new THREE.Mesh(segmentGeometry, segmentMaterial);
            segment.rotation.x = -Math.PI / 2;
            segment.position.x = getRoadCenterX(z);
            segment.position.z = z;
            segment.receiveShadow = true;
            scene.add(segment);
            roadSegments.push(segment);
        }

        // Road markings that follow the curve
        const markings = [];
        const markingGeometry = new THREE.PlaneGeometry(0.5, 4);
        const markingMaterial = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });

        for (let i = 0; i < 200; i++) {
            const z = i * 10 - 1000;
            const marking = new THREE.Mesh(markingGeometry, markingMaterial);
            marking.rotation.x = -Math.PI / 2;
            marking.position.set(getRoadCenterX(z), 0.01, z);
            scene.add(marking);
            markings.push(marking);
        }

        // Grass ground (larger area to cover curved road)
        const grassGeometry = new THREE.PlaneGeometry(500, 2000);
        const grassMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
        const grass = new THREE.Mesh(grassGeometry, grassMaterial);
        grass.rotation.x = -Math.PI / 2;
        grass.position.y = -0.1;
        grass.receiveShadow = true;
        scene.add(grass);

        // Trees
        const trees = [];
        function createTree(x, z) {
            const tree = new THREE.Group();

            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.7, 5, 8);
            const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 2.5;
            trunk.castShadow = true;
            tree.add(trunk);

            // Leaves
            const leavesGeometry = new THREE.ConeGeometry(2, 4, 8);
            const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.y = 6;
            leaves.castShadow = true;
            tree.add(leaves);

            tree.position.set(x, 0, z);
            scene.add(tree);
            return tree;
        }

        // Generate trees along the curved road
        for (let i = -1000; i < 1000; i += 30) {
            const roadCenter = getRoadCenterX(i);
            const randomOffset = Math.random() * 20 + 15;
            const side = (Math.random() > 0.5) ? 1 : -1;
            trees.push(createTree(roadCenter + side * (roadWidth / 2 + randomOffset), i));
        }

        // Obstacles (other cars)
        const obstacles = [];
        function createObstacle(x, z) {
            const obstacle = new THREE.Group();

            // Car body
            const bodyGeometry = new THREE.BoxGeometry(3, 1.5, 5);
            const bodyMaterial = new THREE.MeshLambertMaterial({ color: Math.random() * 0xffffff });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 1;
            body.castShadow = true;
            obstacle.add(body);

            // Car cabin
            const cabinGeometry = new THREE.BoxGeometry(2.5, 1, 3);
            const cabinMaterial = new THREE.MeshLambertMaterial({ color: 0x444444 });
            const cabin = new THREE.Mesh(cabinGeometry, cabinMaterial);
            cabin.position.y = 2;
            cabin.castShadow = true;
            obstacle.add(cabin);

            // Wheels
            const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelMaterial = new THREE.MeshLambertMaterial({ color: 0x000000 });

            const positions = [
                [-1.5, 0.4, 1.5],
                [1.5, 0.4, 1.5],
                [-1.5, 0.4, -1.5],
                [1.5, 0.4, -1.5]
            ];

            positions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                obstacle.add(wheel);
            });

            obstacle.position.set(x, 0, z);
            scene.add(obstacle);
            return obstacle;
        }

        // Generate initial obstacles along curved road
        for (let i = 0; i < 8; i++) {
            const z = -50 - Math.random() * 400;
            const roadCenter = getRoadCenterX(z);
            const lane = (Math.random() > 0.5) ? -4 : 4;
            obstacles.push(createObstacle(roadCenter + lane, z));
        }

        // Car dashboard/hood visible from driver POV
        const carInterior = new THREE.Group();

        // Hood
        const hoodGeometry = new THREE.BoxGeometry(4, 0.2, 3);
        const hoodMaterial = new THREE.MeshLambertMaterial({ color: 0xFF0000 });
        const hood = new THREE.Mesh(hoodGeometry, hoodMaterial);
        hood.position.set(0, -0.8, -2);
        carInterior.add(hood);

        // Dashboard
        const dashGeometry = new THREE.BoxGeometry(5, 0.5, 0.5);
        const dashMaterial = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const dashboard = new THREE.Mesh(dashGeometry, dashMaterial);
        dashboard.position.set(0, -1, -1);
        carInterior.add(dashboard);

        // Steering wheel
        const steeringGroup = new THREE.Group();
        const steeringGeometry = new THREE.TorusGeometry(0.4, 0.05, 16, 100);
        const steeringMaterial = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const steering = new THREE.Mesh(steeringGeometry, steeringMaterial);
        steering.rotation.x = Math.PI / 3;
        steeringGroup.add(steering);
        steeringGroup.position.set(0, -0.7, -1.2);
        carInterior.add(steeringGroup);

        // Camera setup (first-person view)
        camera.position.set(0, 2, 0);
        camera.add(carInterior);
        scene.add(camera);

        // Game state
        let speed = 0;
        let score = 0;
        let carX = 0;
        let carZ = 0;
        let carRotation = 0;
        const maxSpeed = 150;
        const acceleration = 0.5;
        const braking = 1;
        const turnSpeed = 0.03;
        const roadFollowStrength = 0.02; // How much the car is pulled toward road center

        // Input handling
        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Game loop
        function animate() {
            requestAnimationFrame(animate);

            // Handle input
            if (keys['w'] || keys['arrowup']) {
                speed = Math.min(speed + acceleration, maxSpeed);
            } else if (keys['s'] || keys['arrowdown']) {
                speed = Math.max(speed - braking, -maxSpeed / 2);
            } else {
                // Gradual deceleration
                if (speed > 0) {
                    speed = Math.max(speed - 0.3, 0);
                } else if (speed < 0) {
                    speed = Math.min(speed + 0.3, 0);
                }
            }

            if (keys['a'] || keys['arrowleft']) {
                carRotation += turnSpeed * (speed / maxSpeed);
                // Rotate steering wheel
                steeringGroup.rotation.z = Math.min(steeringGroup.rotation.z + 0.05, Math.PI / 4);
            } else if (keys['d'] || keys['arrowright']) {
                carRotation -= turnSpeed * (speed / maxSpeed);
                // Rotate steering wheel
                steeringGroup.rotation.z = Math.max(steeringGroup.rotation.z - 0.05, -Math.PI / 4);
            } else {
                // Return steering wheel to center
                if (steeringGroup.rotation.z > 0) {
                    steeringGroup.rotation.z = Math.max(steeringGroup.rotation.z - 0.05, 0);
                } else if (steeringGroup.rotation.z < 0) {
                    steeringGroup.rotation.z = Math.min(steeringGroup.rotation.z + 0.05, 0);
                }
            }

            // Update car position (FIXED: negative for forward movement)
            const speedFactor = speed / 60;
            carX += Math.sin(-carRotation) * speedFactor;
            carZ -= Math.cos(-carRotation) * speedFactor; // Changed to -= for correct forward direction

            // Get the center of the road at current position
            const roadCenterX = getRoadCenterX(carZ);

            // Gently guide car toward road center (makes curved driving easier)
            const offsetFromCenter = carX - roadCenterX;
            carX -= offsetFromCenter * roadFollowStrength;

            // Keep car on road relative to curved center (with some leeway)
            const maxOffsetFromCenter = roadWidth / 2 - 2;
            if (Math.abs(offsetFromCenter) > maxOffsetFromCenter) {
                carX = roadCenterX + Math.sign(offsetFromCenter) * maxOffsetFromCenter;
            }

            // Update camera position and rotation
            camera.position.x = carX;
            camera.position.z = carZ;
            camera.rotation.y = carRotation;

            // Update road segments to follow the curve and create infinite road
            roadSegments.forEach((segment, index) => {
                const segmentZ = segment.position.z;
                const relativeZ = segmentZ - carZ;

                // Respawn segments that are behind the car
                if (relativeZ > 500) {
                    segment.position.z -= numSegments * roadSegmentLength;
                } else if (relativeZ < -500) {
                    segment.position.z += numSegments * roadSegmentLength;
                }

                // Update segment position to follow curve
                segment.position.x = getRoadCenterX(segment.position.z);
            });

            // Update road markings to follow the curve
            markings.forEach(marking => {
                const relativeZ = marking.position.z - carZ;

                // Respawn markings
                if (relativeZ > 1000) {
                    marking.position.z -= 2000;
                } else if (relativeZ < -1000) {
                    marking.position.z += 2000;
                }

                // Update marking position to follow curve
                marking.position.x = getRoadCenterX(marking.position.z);
            });

            // Update trees
            trees.forEach(tree => {
                const relativeZ = tree.position.z - carZ;
                if (relativeZ > 1000) {
                    tree.position.z -= 2000;
                    // Reposition tree along new curve position
                    const roadCenter = getRoadCenterX(tree.position.z);
                    const currentOffset = tree.position.x - getRoadCenterX(tree.position.z + 2000);
                    tree.position.x = roadCenter + currentOffset;
                } else if (relativeZ < -1000) {
                    tree.position.z += 2000;
                    // Reposition tree along new curve position
                    const roadCenter = getRoadCenterX(tree.position.z);
                    const currentOffset = tree.position.x - getRoadCenterX(tree.position.z - 2000);
                    tree.position.x = roadCenter + currentOffset;
                }
            });

            // Move and respawn obstacles along curved road
            obstacles.forEach(obstacle => {
                const relativeZ = obstacle.position.z - carZ;

                if (relativeZ > 100 || relativeZ < -500) {
                    // Respawn ahead on curved road
                    const newZ = carZ - 100 - Math.random() * 300;
                    const roadCenter = getRoadCenterX(newZ);
                    const lane = (Math.random() > 0.5) ? -4 : 4;
                    obstacle.position.x = roadCenter + lane;
                    obstacle.position.z = newZ;
                }

                // Check collision
                const dx = Math.abs(obstacle.position.x - carX);
                const dz = Math.abs(obstacle.position.z - carZ);

                if (dx < 3 && dz < 5 && speed > 0) {
                    // Collision! Reduce speed
                    speed = Math.max(speed * 0.5, 0);
                    score = Math.max(0, score - 10);
                }
            });

            // Update score based on speed
            if (speed > 0) {
                score += speed / 1000;
            }

            // Update HUD
            document.getElementById('speed').textContent = Math.round(Math.abs(speed));
            document.getElementById('score').textContent = Math.round(score);

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
